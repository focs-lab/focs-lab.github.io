<div class="col-12 focs-home">
  <h1>{{ .wcBlock.content.title }}</h1>
  <div class="focs-home-intro">{{ .wcPage.RenderString .wcBlock.content.text }}</div>
  <h2>Research directions</h2>
  <div class="focs-directions">
    {{ range (where site.RegularPages "Section" "projects").ByWeight }}
      <a class="focs-direction" href="{{ .RelPermalink }}">
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary }}</p>
        <span class="focs-direction-more">Explore this direction <span aria-hidden="true">→</span></span>
      </a>
    {{ end }}
  </div>
</div>
